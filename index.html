<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キー・マスター - Windowsショートカットキー特訓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
      color: #1a73e8;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #5f6368;
      margin-bottom: 2rem;
    }

    .mode-select {
      margin-bottom: 2rem;
      text-align: left;
    }

    .mode-label {
      font-weight: bold;
      font-size: 0.95rem;
      color: #3c4043;
      margin-bottom: 0.8rem;
      display: block;
    }

    .mode-options {
      display: flex;
      gap: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 1rem 0.8rem;
      border: 2px solid #dadce0;
      border-radius: 12px;
      background: #f8f9fa;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn:hover {
      border-color: #1a73e8;
      background: #f1f8fe;
    }

    .mode-btn.active {
      border-color: #1a73e8;
      background: #e8f0fe;
      box-shadow: 0 2px 8px rgba(26,115,232,0.2);
    }

    .mode-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: #1a73e8;
      margin-bottom: 4px;
    }

    .mode-desc {
      font-size: 0.78rem;
      color: #70757a;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      background: #f1f3f4;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
    }

    .timer { color: #d93025; }
    .score { color: #188038; }

    .question-box {
      background: #f8f9fa;
      border: 2px dashed #1a73e8;
      border-radius: 14px;
      padding: 2rem 1rem;
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 0.9rem;
      color: #5f6368;
      margin-bottom: 0.8rem;
    }

    .question-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #202124;
    }

    .hint-badge {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.4rem 1rem;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 1px solid #1a73e8;
    }

    .pressed-key {
      min-height: 2.2rem;
      font-size: 1.05rem;
      color: #5f6368;
      margin-bottom: 1.5rem;
    }

    .key-tag {
      display: inline-block;
      background: #202124;
      color: #fff;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-family: monospace;
      font-weight: bold;
    }

    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 0.9rem 2.5rem;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn:hover {
      background-color: #1557b0;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }

    .result-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #202124;
    }

    .result-mode {
      font-size: 0.95rem;
      color: #5f6368;
      margin-bottom: 1.5rem;
    }

    .result-score {
      font-size: 3.5rem;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- スタート画面 -->
    <div id="start-screen">
      <h1>キー・マスター</h1>
      <p class="subtitle">Windowsショートカットキー特訓ゲーム（制限時間: 30秒）</p>

      <div class="mode-select">
        <span class="mode-label">モードを選択してください：</span>
        <div class="mode-options">
          <div class="mode-btn active" id="mode-easy" onclick="selectMode('easy')">
            <div class="mode-title">イージーモード</div>
            <div class="mode-desc">問題文に答えを表示</div>
          </div>
          <div class="mode-btn" id="mode-master" onclick="selectMode('master')">
            <div class="mode-title">マスターモード</div>
            <div class="mode-desc">答え非表示（暗記用）</div>
          </div>
        </div>
      </div>

      <button id="start-btn" class="btn">ゲームスタート</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-screen" class="hidden">
      <div class="info-bar">
        <div class="timer">残り時間: <span id="time">30</span>秒</div>
        <div class="score">正解数: <span id="score">0</span>問</div>
      </div>

      <div class="question-box">
        <div class="question-title">ショートカットキーを押してください</div>
        <div id="question" class="question-text">コピー</div>
        <div id="hint-box" class="hint-badge hidden">Ctrl + C</div>
      </div>

      <div class="pressed-key">
        入力中: <span id="key-display">-</span>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="hidden">
      <div class="result-title">タイムアップ！</div>
      <div id="result-mode-display" class="result-mode">プレイモード: イージーモード</div>
      <p style="color:#5f6368;">あなたの記録</p>
      <div id="final-score" class="result-score">0問</div>
      <button id="restart-btn" class="btn">モード選択へ戻る</button>
    </div>
  </div>

  <script>
    // ブラウザの仕様上、新規タブやウィンドウを開くショートカット（Ctrl+N, Ctrl+T等）は
    // 完全にブロックできないため、安全にゲームができるキーのみをリスト化しています
    const questionsList = [
      { name: "コピー", key: "c", ctrl: true, hint: "Ctrl + C" },
      { name: "貼り付け（ペースト）", key: "v", ctrl: true, hint: "Ctrl + V" },
      { name: "切り取り（カット）", key: "x", ctrl: true, hint: "Ctrl + X" },
      { name: "すべて選択", key: "a", ctrl: true, hint: "Ctrl + A" },
      { name: "元に戻す（アンドゥ）", key: "z", ctrl: true, hint: "Ctrl + Z" },
      { name: "やり直し（リドゥ）", key: "y", ctrl: true, hint: "Ctrl + Y" },
      { name: "上書き保存", key: "s", ctrl: true, hint: "Ctrl + S" },
      { name: "検索", key: "f", ctrl: true, hint: "Ctrl + F" },
      { name: "印刷", key: "p", ctrl: true, hint: "Ctrl + P" },
      { name: "すべて選択", key: "a", ctrl: true, hint: "Ctrl + A" },
      { name: "太字にする(ボールド)", key: "b", ctrl: true, hint: "Ctrl + B"},
      { name: "斜体にする(イタリック)", key: "i", ctrl: true, hint: "Ctrl + I"},
      { name: "下線を引く(アンダーライン)", key: "u", ctrl: true, hint: "Ctrl + U"},
      { name: "ハイパーリンクの挿入", key: "k", ctrl: true, hint: "Ctrl + K"}

    ];

    let currentMode = 'easy'; // 'easy' or 'master'
    let currentQuestion = null;
    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let isPlaying = false;

    // DOM要素
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const questionEl = document.getElementById('question');
    const hintBoxEl = document.getElementById('hint-box');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const keyDisplayEl = document.getElementById('key-display');
    const finalScoreEl = document.getElementById('final-score');
    const resultModeDisplayEl = document.getElementById('result-mode-display');

    // モード選択
    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('mode-easy').classList.toggle('active', mode === 'easy');
      document.getElementById('mode-master').classList.toggle('active', mode === 'master');
    }

    // ゲーム開始
    function startGame() {
      score = 0;
      timeLeft = 30;
      isPlaying = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;

      startScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      nextQuestion();

      // タイマー開始
      timerId = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 次の問題をセット
    function nextQuestion() {
      const randomIndex = Math.floor(Math.random() * questionsList.length);
      currentQuestion = questionsList[randomIndex];
      
      questionEl.textContent = currentQuestion.name;

      if (currentMode === 'easy') {
        hintBoxEl.textContent = currentQuestion.hint;
        hintBoxEl.classList.remove('hidden');
      } else {
        hintBoxEl.classList.add('hidden');
      }

      keyDisplayEl.textContent = "-";
    }

    // ゲーム終了
    function endGame() {
      clearInterval(timerId);
      isPlaying = false;
      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      const modeText = currentMode === 'easy' ? 'イージーモード（答え表示あり）' : 'マスターモード（答え表示なし）';
      resultModeDisplayEl.textContent = `プレイモード: ${modeText}`;
      finalScoreEl.textContent = `${score}問`;
    }

    // キー入力判定
    document.addEventListener('keydown', (e) => {
      if (!isPlaying) return;

      // ブラウザショートカットキーを防止
      if (e.ctrlKey) {
        e.preventDefault();
      }

      // 入力中キーのリアルタイム表示
      let pressedText = "";
      if (e.ctrlKey) pressedText += "Ctrl + ";
      if (e.shiftKey) pressedText += "Shift + ";
      if (e.altKey) pressedText += "Alt + ";
      
      if (e.key !== "Control" && e.key !== "Shift" && e.key !== "Alt") {
        pressedText += e.key.toUpperCase();
      }

      if (pressedText !== "") {
        keyDisplayEl.innerHTML = `<span class="key-tag">${pressedText}</span>`;
      }

      // 正解判定
      const isCtrlMatch = currentQuestion.ctrl ? (e.ctrlKey || e.metaKey) : true;
      const isKeyMatch = e.key.toLowerCase() === currentQuestion.key.toLowerCase();

      if (isCtrlMatch && isKeyMatch) {
        score++;
        scoreEl.textContent = score;
        nextQuestion();
      }
    });

    // イベントリスナー
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', () => {
      resultScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });
  </script>
</body>
</html>
