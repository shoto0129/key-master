<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows ショートカットキー特訓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #1a73e8;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .timer { color: #d93025; }
    .score { color: #188038; }

    .question-box {
      background: #f8f9fa;
      border: 2px dashed #dadce0;
      border-radius: 12px;
      padding: 2rem 1rem;
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 0.9rem;
      color: #5f6368;
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #202124;
    }

    .pressed-key {
      min-height: 1.5rem;
      font-size: 1rem;
      color: #80868b;
      margin-bottom: 1.5rem;
    }

    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1557b0;
    }

    .hidden {
      display: none;
    }

    .result-title {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .result-score {
      font-size: 3rem;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- スタート画面 -->
    <div id="start-screen">
      <h1>Windows ショートカットキー特訓</h1>
      <p style="margin-bottom: 2rem; color: #5f6368;">
        表示される操作のショートカットキーを押してください。<br>制限時間は30秒です！
      </p>
      <button id="start-btn" class="btn">スタート</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-screen" class="hidden">
      <div class="info-bar">
        <div class="timer">残り時間: <span id="time">30</span>秒</div>
        <div class="score">正解数: <span id="score">0</span>問</div>
      </div>

      <div class="question-box">
        <div class="question-title">実行するショートカットキーは？</div>
        <div id="question" class="question-text">コピー</div>
      </div>

      <div class="pressed-key">
        入力中: <span id="key-display">-</span>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="hidden">
      <div class="result-title">タイムアップ！</div>
      <p>あなたの記録</p>
      <div id="final-score" class="result-score">0問</div>
      <button id="restart-btn" class="btn">もう一度挑戦</button>
    </div>
  </div>

  <script>
    // 問題データのリスト (Ctrl + キー)
    const questionsList = [
      { name: "コピー", key: "c", ctrl: true },
      { name: "貼り付け（ペースト）", key: "v", ctrl: true },
      { name: "切り取り（カット）", key: "x", ctrl: true },
      { name: "すべて選択", key: "a", ctrl: true },
      { name: "元に戻す（アンドゥ）", key: "z", ctrl: true },
      { name: "やり直し（リドゥ）", key: "y", ctrl: true },
      { name: "上書き保存", key: "s", ctrl: true },
      { name: "検索", key: "f", ctrl: true },
      { name: "印刷", key: "p", ctrl: true },
      { name: "新しいウィンドウを開く", key: "n", ctrl: true }
    ];

    let currentQuestion = null;
    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let isPlaying = false;

    // DOM要素
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const questionEl = document.getElementById('question');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const keyDisplayEl = document.getElementById('key-display');
    const finalScoreEl = document.getElementById('final-score');

    // ゲーム開始
    function startGame() {
      score = 0;
      timeLeft = 30;
      isPlaying = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;

      startScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      nextQuestion();

      // カウントダウンタイマー
      timerId = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 次の問題をセット
    function nextQuestion() {
      // ランダムに問題を選択
      const randomIndex = Math.floor(Math.random() * questionsList.length);
      currentQuestion = questionsList[randomIndex];
      questionEl.textContent = currentQuestion.name;
      keyDisplayEl.textContent = "-";
    }

    // ゲーム終了
    function endGame() {
      clearInterval(timerId);
      isPlaying = false;
      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      finalScoreEl.textContent = `${score}問`;
    }

    // キー入力の判定処理
    document.addEventListener('keydown', (e) => {
      if (!isPlaying) return;

      // ブラウザの標準ショートカット（保存・印刷ダイアログ等）を無効化
      if (e.ctrlKey) {
        e.preventDefault();
      }

      // 入力されたキーの視覚表示
      let pressedText = "";
      if (e.ctrlKey) pressedText += "Ctrl + ";
      if (e.shiftKey) pressedText += "Shift + ";
      if (e.altKey) pressedText += "Alt + ";
      if (e.key !== "Control" && e.key !== "Shift" && e.key !== "Alt") {
        pressedText += e.key.toUpperCase();
      }
      keyDisplayEl.textContent = pressedText;

      // 正解判定
      const isCtrlMatch = currentQuestion.ctrl ? (e.ctrlKey || e.metaKey) : true;
      const isKeyMatch = e.key.toLowerCase() === currentQuestion.key.toLowerCase();

      if (isCtrlMatch && isKeyMatch) {
        score++;
        scoreEl.textContent = score;
        nextQuestion();
      }
    });

    // イベントリスナー
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
